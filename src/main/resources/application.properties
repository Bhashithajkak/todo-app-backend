spring.application.name=todo-app-backend

#Database Properties
spring.datasource.url=jdbc:mysql://localhost:3306/${SPRING_DATASOURCE_DATABASE:todo_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USER:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@12345}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hikari settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariPool-1

# Spring Security
spring.security.user.name=${SPRING_SECURITY_USERNAME:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}
security.jwt.secret-key=${JWT_SECRET_KEY:2lYHIETKr8xHDeLmEtodoW5nNuAdSxllkI50+HxD2F2ZBpXXV8Ze0VAMJtJox9YLYxFUTm7Urun6vmGKRr64Avs9jQ==}
#15 min
security.jwt.access-token-expiration-time=900000 
#7 days
security.jwt.refresh-token-expiration-time=604800000
